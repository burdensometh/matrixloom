[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "matrixloom"
version = "1.0.0"
description = "Typed sample matrices, fitted features, and reproducible numerical analysis"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
matrixloom-migrate = "matrixloom.migration:main"

[tool.setuptools.packages.find]
include = ["matrixloom*"]
